[project]
name = "acme-api"
version = "0.1.0"
description = "API service"
requires-python = ">=3.13,<3.14"

# Exact pins, no ranges (ADR-0021). Python 3.13 not 3.14: the dependency
# chain will have a wheel gap on 3.14 and compiling asyncpg from source at
# the wrong moment costs a day.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "redis==8.1.0",
    "arq==0.28.0",
    "structlog==26.1.0",
    "orjson==3.12.0",
    "pyjwt[crypto]==2.13.0",
    "cryptography==50.0.1",
    "python-multipart==0.0.32",
    "sentry-sdk[fastapi]==2.68.1",
    # UUIDv7 generated in the application, not the database (ADR-0010).
    # The ID must exist before the insert so offline-created records work.
    "uuid-utils==0.17.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # Real Postgres in tests. SQLite would leave partial indexes, citext,
    # JSONB operators and LISTEN/NOTIFY untested - all of which we depend on.
    "testcontainers[postgres]==4.15.0",
    "import-linter==2.15",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes - all timestamps are tz-aware UTC
    "T20",       # no print - structured logging only (ADR-0024)
    "SIM",       # simplify
    "TCH",       # type-checking imports
    "RUF",
    "ASYNC",     # async correctness
    "S",         # bandit security
]
ignore = [
    "S101",      # assert is fine in tests
    "B008",      # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "DTZ"]
"migrations/*" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["acme"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*", "tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs a real Postgres container",
    "slow: excluded from the fast pre-push run",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
